{% extends "base.html" %}
{% block title %}Sign in — {{ agency.name }}{% endblock %}

{% block body %}
<main class="section narrow">
  <h1>Sign in</h1>

  {% if error %}<p class="flash flash-error">{{ error }}</p>{% endif %}

  <form method="post" class="form" novalidate>
    <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">

    <label for="username">Username</label>
    <input id="username" name="username" type="text" value="{{ username }}" autofocus
           autocomplete="username">

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password">

    <div class="form-actions">
      <button class="btn btn-solid" type="submit">Sign in</button>
    </div>
  </form>

  <p class="muted">No account yet? <a href="{{ url_for('signup') }}">Sign up</a>.</p>
</main>
{% endblock %}
